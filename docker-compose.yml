x-ctfd-base: &ctfd-base
  build: /opt/CTFd
  platform: linux/amd64
  user: root
  entrypoint: ""

x-ctfd-env: &ctfd-env
  DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASS}@pgbouncer:5432/${DB_NAME}
  REDIS_URL: redis://cache:6379
  DOJO_HOST: ${DOJO_HOST}
  WORKSPACE_HOST: ${WORKSPACE_HOST}
  WORKSPACE_HTTPS_PORT: ${WORKSPACE_HTTPS_PORT:-443}
  DOJO_IP_MODE: ${DOJO_IP_MODE:-false}
  DOJO_HTTP_ENABLED: ${DOJO_HTTP_ENABLED:-false}
  WORKSPACE_SECRET: ${WORKSPACE_SECRET}
  DOJO_SSH_SERVICE_KEY: ${DOJO_SSH_SERVICE_KEY}
  HOST_DATA_PATH: /data
  MAIL_SERVER: ${MAIL_SERVER}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ADDRESS: ${MAIL_ADDRESS}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
  DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
  INTERNET_FOR_ALL: ${INTERNET_FOR_ALL}
  MAC_HOSTNAME: ${MAC_HOSTNAME}
  MAC_USERNAME: ${MAC_USERNAME}
  DOJO_AI_ENABLED: ${DOJO_AI_ENABLED:-auto}
  DOJO_AI_BASE_URL: ${DOJO_AI_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DOJO_AI_API_KEY: ${DOJO_AI_API_KEY:-}
  DOJO_LINUX_RUNTIME_IMAGE: ${DOJO_LINUX_RUNTIME_IMAGE:-pwncollege/challenge-legacy:latest}
  DOJO_WINDOWS_RUNTIME_IMAGE: ${DOJO_WINDOWS_RUNTIME_IMAGE:-aisecedu/windows-runtime:1}
  DOJO_AI_TUTOR_MODEL: ${DOJO_AI_TUTOR_MODEL:-deepseek-v4-flash}
  DOJO_AI_GUIDE_MODEL: ${DOJO_AI_GUIDE_MODEL:-deepseek-v4-flash}
  DOJO_AI_GRADER_MODEL: ${DOJO_AI_GRADER_MODEL:-deepseek-v4-flash}
  DOJO_AI_SOLUTION_MODEL: ${DOJO_AI_SOLUTION_MODEL:-deepseek-v4-flash}
  DOJO_AI_AUTHORING_PLAN_MODEL: ${DOJO_AI_AUTHORING_PLAN_MODEL:-deepseek-v4-flash}
  DOJO_AI_AUTHORING_BUILD_MODEL: ${DOJO_AI_AUTHORING_BUILD_MODEL:-deepseek-v4-flash}
  DOJO_AI_AUTHORING_VALIDATE_MODEL: ${DOJO_AI_AUTHORING_VALIDATE_MODEL:-deepseek-v4-flash}
  DOJO_AI_AUTHORING_VALIDATION_MAX_ROUNDS: ${DOJO_AI_AUTHORING_VALIDATION_MAX_ROUNDS:-5}
  DOJO_AI_TIMEOUT_SECONDS: ${DOJO_AI_TIMEOUT_SECONDS:-120}
  # Deep reasoning authoring calls can legitimately need a retry after a
  # nearly complete JSON response.  Keep the per-request idle timeout bounded,
  # but give the whole retry budget enough wall-clock time to finish.
  DOJO_AI_TOTAL_TIMEOUT_SECONDS: ${DOJO_AI_TOTAL_TIMEOUT_SECONDS:-600}
  DOJO_AI_MAX_CONTEXT_CHARS: ${DOJO_AI_MAX_CONTEXT_CHARS:-180000}
  DOJO_AI_MAX_FILE_CHARS: ${DOJO_AI_MAX_FILE_CHARS:-32000}
  DOJO_CODE_START_CONCURRENCY: ${DOJO_CODE_START_CONCURRENCY:-64}
  DOJO_DESKTOP_START_CONCURRENCY: ${DOJO_DESKTOP_START_CONCURRENCY:-64}
  DOJO_CODE_START_TIMEOUT_SECONDS: ${DOJO_CODE_START_TIMEOUT_SECONDS:-240}
  DOJO_DESKTOP_START_TIMEOUT_SECONDS: ${DOJO_DESKTOP_START_TIMEOUT_SECONDS:-120}
  DOJO_TERMINAL_START_TIMEOUT_SECONDS: ${DOJO_TERMINAL_START_TIMEOUT_SECONDS:-30}
  DOJO_SERVICE_START_WAIT_SECONDS: ${DOJO_SERVICE_START_WAIT_SECONDS:-600}
  DOJO_SERVICE_START_LEASE_SECONDS: ${DOJO_SERVICE_START_LEASE_SECONDS:-300}
  DOJO_CTF_CORPUS_DIR: /var/ctf-corpus
  GLOBAL_AGENT_RUNTIME_INTERNAL_URL: http://agent-runtime:3000/agent-runtime
  GLOBAL_AGENT_RUNTIME_PUBLIC_ORIGIN: ${GLOBAL_AGENT_RUNTIME_PUBLIC_ORIGIN:-https://${DOJO_HOST}/agent-runtime}
  GLOBAL_AGENT_RUNTIME_TICKET_SECRET: ${GLOBAL_AGENT_RUNTIME_TICKET_SECRET:?GLOBAL_AGENT_RUNTIME_TICKET_SECRET must be set by dojo init}
  GLOBAL_AGENT_RUNTIME_SERVICE_SECRET: ${GLOBAL_AGENT_RUNTIME_SERVICE_SECRET:?GLOBAL_AGENT_RUNTIME_SERVICE_SECRET must be set by dojo init}

x-ctfd-volumes: &ctfd-volumes
  - /data/dojos:/var/dojos
  - /data/ctf-corpus:/var/ctf-corpus:ro
  - /data/agent-runtime:/var/agent-runtime
  - /data/platform-removal:/data/platform-removal
  - /data/workspace_nodes.json:/var/workspace_nodes.json:ro
  - ./user_firewall.allowed:/var/user_firewall.allowed:ro
  - /etc/docker/seccomp.json:/etc/docker/seccomp.json:ro
  - /var/run/docker.sock:/var/run/docker.sock:ro
  - /opt/pwn.college/dojo_plugin:/opt/CTFd/CTFd/plugins/dojo_plugin:ro

x-ctfd-depends: &ctfd-depends
  pgbouncer:
    condition: service_started
  cache:
    condition: service_started

services:
  splunk:
    container_name: splunk
    profiles:
      - splunk
    restart: always
    image: splunk/splunk:9.1.2
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=DojoSplunk2024!
      - SPLUNK_HEC_TOKEN=11111111-1111-1111-1111-111111111111
    ports:
      - "8001:8000" # Splunk Web (changed from 8000 to avoid conflict with CTFd)
      - "8088:8088" # HEC
      - "8089:8089" # Splunk management
    volumes:
      - /data/splunk/etc:/opt/splunk/etc
      - /data/splunk/var:/opt/splunk/var
      - /opt/pwn.college/splunk/default.yml:/tmp/defaults/default.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  workspace-builder:
    container_name: workspace-builder
    hostname: workspace-builder
    network_mode: host
    profiles:
      - workspace
    build: ./workspace
    environment:
      - DOJO_WORKSPACE=${DOJO_WORKSPACE:-full}
      - NIX_GARBAGE_COLLECT=${NIX_GARBAGE_COLLECT:-false}
    volumes:
      - /data/workspace/nix:/nix

  dojofs:
    container_name: dojofs
    hostname: dojofs
    profiles:
      - workspace
    restart: always
    privileged: true
    pid: host
    build: ./dojofs
    volumes:
      - /run/dojo:/run/dojo:shared
      - /var/run/docker.sock:/var/run/docker.sock:ro

  homefs:
    container_name: homefs
    hostname: homefs
    profiles:
      - main
      - workspace
    restart: always
    privileged: true
    build: ./homefs
    environment:
      - STORAGE_ROOT=/run/homefs
      - STORAGE_HOST=192.168.42.1
    volumes:
      - /run/homefs:/run/homefs:shared
      - /var/run/docker/plugins:/var/run/docker/plugins
    ports:
      - "4201:4201"

  ctfd:
    <<: *ctfd-base
    container_name: ctfd
    profiles:
      - main
    restart: always
    hostname: ctfd
    command:
      - /bin/sh
      - -c
      - |
        if [ "$DOJO_ENV" = "development" ]; then
          FLASK_DEBUG=True WERKZEUG_DEBUG_PIN=off flask run --host 0.0.0.0 --port 8000;
        elif [ "$DOJO_ENV" = "coverage" ]; then
          FLASK_DEBUG=True WERKZEUG_DEBUG_PIN=off exec coverage run --source=CTFd/plugins/dojo_plugin -m flask run --no-reload --host 0.0.0.0 --port 8000;
        elif [ "$DOJO_ENV" = "production" ]; then
          RUN_ID=$(openssl rand -hex 4) ./docker-entrypoint.sh;
        else
          echo "Failed to start ctfd - environment variable DOJO_ENV has invalid value \"$DOJO_ENV\""
        fi
    ulimits:
      nofile:
        soft: 32768
        hard: 1048576
    environment:
      <<: *ctfd-env
      UPLOAD_FOLDER: /var/uploads
      # Page rendering is CPU-bound under classroom-wide bursts.  The target
      # host has 64 cores; 32 workers leave capacity for PostgreSQL, nginx and
      # hundreds of Kata workspace VMs while avoiding the eight-core ceiling
      # observed at 200 concurrent learners.
      WORKERS: ${CTFD_WORKERS:-32}
      CTFD_GEVENT_PSYCOPG: ${CTFD_GEVENT_PSYCOPG:-true}
      # DeepSeek Flash authoring can run several bounded build/review/repair
      # calls in one request. Keep Gunicorn aligned with the 3600-second
      # learning API proxy window instead of killing a healthy worker at the
      # default timeout.
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:---config /etc/ctfd/gunicorn.py --timeout 3600 --graceful-timeout 3600}
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      REVERSE_PROXY: "true"
      SERVER_SENT_EVENTS: "false"
      SECRET_KEY: ${SECRET_KEY}
      DOJO_ENV: ${DOJO_ENV}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOJO_HOST}}
      DOCKER_USERNAME: ${DOCKER_USERNAME}
      DOCKER_TOKEN: ${DOCKER_TOKEN}
    volumes:
      - /data/CTFd/logs:/var/log/CTFd
      - /data/CTFd/uploads:/var/uploads
      - /data/mac:/var/mac
      - /data/homes:/var/homes:shared
      - /data/dojos:/var/dojos
      - /data/ctf-corpus:/var/ctf-corpus:ro
      - /data/agent-runtime:/var/agent-runtime
      - /data/platform-removal:/data/platform-removal
      - /data/ctfd-ipython:/root/.ipython
      - ./data/coverage:/var/coverage
      - /data/workspace_nodes.json:/var/workspace_nodes.json:ro
      - /data/ssh_host_keys/ssh_known_hosts:/etc/ssh/ssh_known_hosts:ro
      - ./ops/gunicorn-ctfd.py:/etc/ctfd/gunicorn.py:ro
      - ./user_firewall.allowed:/var/user_firewall.allowed:ro
      - /etc/docker/seccomp.json:/etc/docker/seccomp.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/pwn.college/dojo_plugin:/opt/CTFd/CTFd/plugins/dojo_plugin:ro
      - /opt/pwn.college/dojo_theme:/opt/CTFd/CTFd/themes/dojo_theme:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import requests
          response = requests.get('http://localhost:8000')
          response.raise_for_status()
      interval: 10s
      timeout: 10s
      retries: 3
    depends_on:
      <<: *ctfd-depends

  db:
    container_name: db
    hostname: db
    profiles:
      - main
    restart: always
    image: postgres:17.5
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-256}"]
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - PGUSER=${DB_USER}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 10s
      retries: 3

  pgbouncer:
    container_name: pgbouncer
    hostname: pgbouncer
    profiles:
      - main
    restart: always
    image: edoburu/pgbouncer
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}/${DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      # Keep enough transaction slots for interactive bursts while retaining
      # headroom below PostgreSQL's explicitly raised connection ceiling.
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-160}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-32}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-2}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-192}
    depends_on:
      db:
        condition: service_started

  cache:
    container_name: cache
    hostname: cache
    profiles:
      - main
    restart: always
    image: redis:8
    volumes:
      - /data/redis:/data

  agent-runtime:
    container_name: agent-runtime
    hostname: agent-runtime
    profiles:
      - main
    restart: always
    build:
      context: ${GLOBAL_AGENT_RUNTIME_BUILD_CONTEXT:-./services/agent-runtime}
      args:
        AISECEDU_INTEGRATED: "true"
        NEXT_PUBLIC_AISECEDU_INTEGRATED: "true"
        NEXT_PUBLIC_BASE_PATH: /agent-runtime
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AISECEDU_INTEGRATED: "true"
      NEXT_PUBLIC_AISECEDU_INTEGRATED: "true"
      NEXT_PUBLIC_BASE_PATH: /agent-runtime
      AISECEDU_INTERNAL_URL: http://ctfd:8000
      AISECEDU_PUBLIC_ORIGIN: ${AISECEDU_PUBLIC_ORIGIN:-https://${DOJO_HOST}}
      AISECEDU_SERVICE_SECRET: ${GLOBAL_AGENT_RUNTIME_SERVICE_SECRET:?GLOBAL_AGENT_RUNTIME_SERVICE_SECRET must be set by dojo init}
      AISECEDU_AGENT_SKILLS_DIR: /app/agent-skills
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${DOJO_AI_API_KEY:-}}
      DEEPSEEK_BASE_URL: ${DOJO_AI_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODELS: ${GLOBAL_AGENT_RUNTIME_MODELS:-deepseek-v4-flash}
      DEFAULT_MODEL: ${GLOBAL_AGENT_RUNTIME_DEFAULT_MODEL:-deepseek:deepseek-v4-flash}
      MODEL_ROUTES: ${GLOBAL_AGENT_RUNTIME_MODEL_ROUTES:-{"scene-content":"deepseek:deepseek-v4-flash","scene-actions":"deepseek:deepseek-v4-flash","generate-classroom":"deepseek:deepseek-v4-flash","pbl-v2-runtime":"deepseek:deepseek-v4-flash","pbl-chat":"deepseek:deepseek-v4-flash","chat-adapter":"deepseek:deepseek-v4-flash","security-roleplay":"deepseek:deepseek-v4-flash","maic-agent":"deepseek:deepseek-v4-flash"}}
      ALLOWED_FRAME_ANCESTORS: ${GLOBAL_AGENT_RUNTIME_FRAME_ANCESTORS:-https://${DOJO_HOST} http://${DOJO_HOST}}
    volumes:
      - agent-runtime-data:/app/data
      - ./agent_skills:/app/agent-skills:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/agent-runtime/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12

  stats-worker:
    <<: *ctfd-base
    container_name: stats-worker
    hostname: stats-worker
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/__main__.py"]
    environment:
      <<: *ctfd-env
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends

  image-pull-worker:
    <<: *ctfd-base
    container_name: image-pull-worker
    hostname: image-pull-worker
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/image_pulls_main.py"]
    environment:
      <<: *ctfd-env
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends

  teaching-worker:
    <<: *ctfd-base
    container_name: teaching-worker
    hostname: teaching-worker
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/teaching_main.py"]
    environment:
      <<: *ctfd-env
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends
      agent-runtime:
        condition: service_healthy

  # A second interactive consumer keeps material analysis, grading and normal
  # Agent requests responsive while another worker is handing legacy stream
  # entries off to the dedicated native-authoring queue.
  teaching-interactive-worker:
    <<: *ctfd-base
    container_name: teaching-interactive-worker
    hostname: teaching-interactive-worker
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/teaching_main.py"]
    environment:
      <<: *ctfd-env
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends
      agent-runtime:
        condition: service_healthy

  # Native challenge authoring and autonomous solution validation can run for
  # minutes.  Isolating them in their own Redis stream prevents a busy course
  # from starving unrelated courseware and classroom work.
  teaching-authoring-worker:
    <<: *ctfd-base
    container_name: teaching-authoring-worker
    hostname: teaching-authoring-worker
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/teaching_main.py"]
    environment:
      <<: *ctfd-env
      TEACHING_WORKER_STREAM: teaching:authoring
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends
      agent-runtime:
        condition: service_healthy

  # Keep native authoring concurrency deliberately bounded at two.  Most of
  # the wall time is remote model inference, so a second consumer removes
  # head-of-line blocking for independent questions without creating an
  # unbounded burst against the model provider or shared validation runtime.
  teaching-authoring-worker-2:
    <<: *ctfd-base
    image: pwncollege-teaching-authoring-worker:latest
    container_name: teaching-authoring-worker-2
    hostname: teaching-authoring-worker-2
    profiles:
      - main
    restart: always
    command: ["flask", "shell", "/opt/CTFd/CTFd/plugins/dojo_plugin/worker/teaching_main.py"]
    environment:
      <<: *ctfd-env
      TEACHING_WORKER_STREAM: teaching:authoring
    volumes: *ctfd-volumes
    depends_on:
      <<: *ctfd-depends
      agent-runtime:
        condition: service_healthy

  sshd:
    container_name: sshd
    hostname: sshd
    profiles:
      - main
    restart: always
    build: ./sshd
    volumes:
      - /data/workspace_nodes.json:/var/workspace_nodes.json:ro
      - /data/ssh_host_keys:/etc/ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/mac:/var/mac:ro
    extra_hosts:
      - "pwn.college:192.168.42.1"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASS}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://cache:6379
      - DOJO_SSH_SERVICE_KEY=${DOJO_SSH_SERVICE_KEY}
      - MAC_HOSTNAME=${MAC_HOSTNAME}
      - MAC_USERNAME=${MAC_USERNAME}
    ports:
      - "22:22"
    depends_on:
      pgbouncer:
        condition: service_started
      cache:
        condition: service_started

  nginx:
    container_name: nginx
    hostname: nginx
    profiles:
      - main
    restart: always
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
      - "4443:4443"
    environment:
      - DOJO_HOST=${DOJO_HOST}
      - DOJO_ENV=${DOJO_ENV}
      - WORKSPACE_HOST=${WORKSPACE_HOST}
      - WORKSPACE_HTTPS_PORT=${WORKSPACE_HTTPS_PORT:-443}
      - WORKSPACE_SECRET=${WORKSPACE_SECRET}
      - AISECEDU_PUBLIC_ORIGIN=${AISECEDU_PUBLIC_ORIGIN}
      - DOJO_HTTP_ENABLED=${DOJO_HTTP_ENABLED:-false}
    volumes:
      - /data/acme:/var/cache/nginx/acme-letsencrypt
      - /data/local-tls:/etc/nginx/local-tls:ro
      - /data/local-tls/ca.crt:/usr/share/nginx/html/pwncollege-local-ca.crt:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/public-origin.conf.template:/etc/nginx/templates/public-origin.conf.template:ro
      - ./nginx/templates/http-mode.conf.template:/etc/nginx/templates/http-mode.conf.template:ro
      - ./nginx/templates/workspace.conf.template:/etc/nginx/templates/workspace.conf.template:ro
      - ./nginx/conf.d/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
      - ./nginx/conf.d/location-theme-assets.conf:/etc/nginx/conf.d/location-theme-assets.conf:ro
      - ./ops/nginx-local/server-http.conf:/etc/nginx/conf.d/server-http.prod.conf:ro
      - ./ops/nginx-local/server-https.conf:/etc/nginx/conf.d/server-https.prod.conf:ro
      - ./ops/nginx-local/disabled.conf:/etc/nginx/conf.d/server-http-future.prod.conf:ro
      - ./ops/nginx-local/disabled.conf:/etc/nginx/conf.d/server-https-future.prod.conf:ro
      - ./ops/nginx-local/disabled.conf:/etc/nginx/conf.d/workspace-http.prod.conf:ro
      - ./ops/nginx-local/workspace-https.conf:/etc/nginx/conf.d/workspace-https.prod.conf:ro
      - ./nginx/conf.d/location-learning-ai.conf:/etc/nginx/conf.d/location-learning-ai.conf:ro
      - ./nginx/conf.d/location-workspace-api.conf:/etc/nginx/conf.d/location-workspace-api.conf:ro
    networks:
      default:
      workspace_net:
        aliases:
          - nginx
        ipv4_address: 10.0.0.3
    depends_on:
      agent-runtime:
        condition: service_started

  nginx-workspace:
    container_name: nginx-workspace
    hostname: nginx-workspace
    profiles:
      - workspace_exclusive
    restart: always
    build: ./nginx-workspace
    ports:
      - "80:80"
      - "443:443"
      - "8888:8888"
    environment:
      - DOJO_ENV=${DOJO_ENV}
      - WORKSPACE_HOST=${WORKSPACE_HOST}
      - WORKSPACE_SECRET=${WORKSPACE_SECRET}
    volumes:
      - /data/acme:/var/cache/nginx/acme-letsencrypt
    networks:
      default:
        aliases:
          - ${WORKSPACE_HOST}
      workspace_net:
        aliases:
          - nginx
        ipv4_address: 10.0.0.3

  node-exporter:
    container_name: node-exporter
    hostname: node-exporter
    profiles:
      - main
      - workspace
    restart: always
    image: prom/node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.udev.data=/host/host-run-udev/data"
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    container_name: cadvisor
    hostname: cadvisor
    profiles:
      - main
      - workspace
    restart: always
    image: gcr.io/cadvisor/cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /data/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    container_name: prometheus
    hostname: prometheus
    profiles:
      - main
    restart: always
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/global-agent-runtime.rules.yml:/etc/prometheus/rules/global-agent-runtime.rules.yml:ro
      - prometheus_targets:/etc/prometheus/targets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 3
    depends_on:
      prometheus-generate-targets:
        condition: service_completed_successfully

  prometheus-generate-targets:
    image: python:3.12-slim
    profiles:
      - main
    command:
      - /usr/local/bin/python
      - -c
      - |
        import json
        import os
        main_node_ip = "192.168.42.1"
        workspace_nodes = json.load(open("/var/workspace_nodes.json"))
        workspace_node_ips = [f"192.168.42.{int(node_id) + 1}" for node_id in workspace_nodes]
        cadvisor_targets = [{
            "labels": {"job": "cadvisor"},
            "targets": [f"{ip}:8080" for ip in [main_node_ip] + workspace_node_ips]
        }]
        node_exporter_targets = [{
            "labels": {"job": "node_exporter"},
            "targets": [f"{ip}:9100" for ip in [main_node_ip] + workspace_node_ips]
        }]
        for name, targets in {
            "cadvisor": cadvisor_targets,
            "node_exporter": node_exporter_targets,
        }.items():
            path = f"/etc/prometheus/targets/{name}.json"
            temporary_path = f"{path}.tmp"
            with open(temporary_path, "w") as f:
                json.dump(targets, f, indent=2)
            os.replace(temporary_path, path)
    volumes:
      - /data/workspace_nodes.json:/var/workspace_nodes.json:ro
      - prometheus_targets:/etc/prometheus/targets

  frontend:
    container_name: frontend
    profiles:
      - future
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DOJO_HOST=${DOJO_HOST}
        - NEXT_PUBLIC_DOJO_ENV=${DOJO_ENV}
    user: root
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_DOJO_HOST=${DOJO_HOST}
      - NEXT_PUBLIC_DOJO_ENV=${DOJO_ENV}
      - NODE_ENV=${DOJO_ENV}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    command:
      - /bin/sh
      - -c
      - |
        if [ "$DOJO_ENV" = "production" ]; then
          exec bun ./server.js
        else
          cd /opt/pwn.college/frontend
          if [ ! -x node_modules/.bin/next ]; then
            bun install
          fi
          exec bun dev --turbo
        fi
    volumes:
      - /opt/pwn.college/frontend:/opt/pwn.college/frontend

  grafana:
    container_name: grafana
    hostname: grafana
    profiles:
      - main
    restart: always
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/aisecedu.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  watchdog:
    container_name: watchdog
    hostname: watchdog
    profiles:
      - main
    restart: always
    build: ./watchdog
    volumes:
      - /data/workspace_nodes.json:/var/workspace_nodes.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  create-workspace-net:
    profiles:
      - main
      - workspace
    image: busybox:uclibc
    command: /bin/true
    networks:
      - workspace_net

volumes:
  prometheus_targets:
  agent-runtime-data:
    name: ${GLOBAL_AGENT_RUNTIME_DATA_VOLUME:-pwncollege_agent-runtime-data}

networks:
  default:
    driver: bridge
  workspace_net:
    name: workspace_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/8
    driver_opts:
      com.docker.network.bridge.name: "workspace_net"
