name: Team quick checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - develop
      - main
      - master
      - 'team/**'
permissions:
  contents: read
jobs:
  contributor-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make dev-check
      - name: Courseware editor browser component checks
        if: hashFiles('test/browser/courseware-quiz-editor.cjs') != ''
        env:
          NODE_PATH: ${{ runner.temp }}/aisecedu-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/aisecedu-browser" --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/aisecedu-browser/node_modules/.bin/playwright" install --with-deps chromium
          node --test test/browser/courseware-quiz-editor.cjs
