{% if user %}
<aside class="learning-tutor-panel is-collapsed" data-learning-tutor>
  <button type="button" class="learning-tutor-toggle" aria-expanded="false" aria-label="打开 AI 学习助手" title="打开 AI 学习助手">
    <i class="fas fa-user-ninja" data-tutor-toggle-icon></i>
    <span class="sr-only">展开或收起 AI 学习助手</span>
  </button>
  <div class="learning-tutor-content">
    <div class="learning-tutor-header">
      <div>
        <h4>AI 学习助手</h4>
        <span class="learning-tutor-status is-checking" data-tutor-status role="status" hidden>
          <i class="fas fa-circle-notch fa-spin"></i>
          <span>正在检查 AI 学习助手</span>
        </span>
      </div>
    </div>
    <div class="learning-tutor-messages" data-tutor-messages></div>
    <div class="learning-tutor-thinking" data-tutor-thinking hidden>
      <span></span><span></span><span></span>
      <small>正在结合你的实时进度分析，通常需要 30-60 秒…</small>
    </div>
    <label class="learning-tutor-field learning-tutor-question">
      <span>问题</span>
      <textarea class="form-control" rows="4" data-tutor-question placeholder="你下一步想理解或验证什么？"></textarea>
    </label>
    <button type="button" class="btn btn-primary btn-block" data-tutor-send><span>询问 AI 学习助手</span></button>
    <a class="learning-tutor-analysis-link" href="/guide" data-tutor-full-link>
      <i class="fas fa-expand-alt"></i>
      <span>在完整助手中继续</span>
    </a>
    <a class="learning-tutor-analysis-link" href="/dojo/{{ dojo.reference_id }}/learning">
      <i class="fas fa-chart-line"></i>
      <span>查看学习分析</span>
    </a>
  </div>
</aside>
{% endif %}
