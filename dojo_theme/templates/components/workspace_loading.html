<div class="workspace-loading is-active" data-workspace-loading role="status" aria-live="polite" data-stage="queued">
  <div class="workspace-loading-spinner" aria-hidden="true"></div>
  <strong data-workspace-loading-title>已加入启动队列</strong>
  <span data-workspace-loading-detail>正在确认当前题目与运行资源…</span>
  <ol class="workspace-loading-stages" aria-label="实验环境启动进度">
    <li data-workspace-stage="queued"><i class="fas fa-check" aria-hidden="true"></i><span>排队</span></li>
    <li data-workspace-stage="container"><i class="fas fa-box" aria-hidden="true"></i><span>准备容器</span></li>
    <li data-workspace-stage="service"><i class="fas fa-link" aria-hidden="true"></i><span>连接服务</span></li>
    <li data-workspace-stage="interaction"><i class="fas fa-keyboard" aria-hidden="true"></i><span>准备交互</span></li>
  </ol>
  <div class="workspace-loading-actions">
    <button type="button" data-workspace-loading-retry hidden><i class="fas fa-redo" aria-hidden="true"></i>重试连接</button>
    <button type="button" data-workspace-loading-cancel><i class="fas fa-times" aria-hidden="true"></i>取消本次连接</button>
  </div>
</div>
