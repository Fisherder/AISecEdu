{% macro scoreboard() -%}
<div class="scoreboard-controls row">
  <p>
  <span id="scoreboard-control-week"><a href="javascript:loadScoreboard(7, 1)">近 7 天</a></span> |
  <span id="scoreboard-control-month"><a href="javascript:loadScoreboard(30, 1)">近 30 天</a></span> |
  <span id="scoreboard-control-all"><a href="javascript:loadScoreboard(0, 1)">全部时间</a></span>
  </p>
  <div class="scoreboard-view-controls">
    <div id="scoreboard-crew-mode-toggle" class="scoreboard-view-toggle brand-mono" role="tablist" aria-label="团队计分方式" hidden>
      <a id="scoreboard-crew-mode-cumulative" role="tab" aria-selected="true" href="javascript:setCrewMode('cumulative')">累计</a>
      <a id="scoreboard-crew-mode-unique" role="tab" aria-selected="false" href="javascript:setCrewMode('unique')">去重</a>
    </div>
    <div class="scoreboard-view-toggle brand-mono" role="tablist" aria-label="排行榜视图">
      <a id="scoreboard-view-hackers" role="tab" aria-selected="true" href="javascript:setScoreboardView('hackers')">学生</a>
      <a id="scoreboard-view-crews" role="tab" aria-selected="false" href="javascript:setScoreboardView('crews')">团队</a>
    </div>
  </div>
</div>
<div class="scoreboard row">
  <div class="col-md-12 p-0">
    <table class="table table-striped">
	    <thead>
	      <tr>
	        <td scope="col" class="col-md-1"><b>排名</b></td>
          <td scope="col" class="col-md-1"></td>
	        <td scope="col" class="col-md-4"><b id="scoreboard-th-name">学生</b></td>
	        <td scope="col" class="col-md-5"><b id="scoreboard-th-badges">徽章</b></td>
	        <td scope="col" class="col-md-1"><b id="scoreboard-th-score">完成数</b></td>
	      </tr>
	    </thead>
	    <tbody id="scoreboard">
	    </tbody>
    </table>
  </div>
  <div>
    <ul id="scoreboard-pages" class="p-0">
    </ul>
  </div>
</div>
{%- endmacro %}
