<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSA 检查样本</title><style>body{margin:16px;font:16px sans-serif}section{margin:16px 0}svg{height:140px;width:100%}button,input{padding:8px;margin:4px}label{display:inline-block}output{display:inline-block;margin:8px}fieldset{margin:12px 0}</style></head><body><h1>RSA 参数与消息路径</h1><nav data-demo="workflow"><button data-stage="0">密钥</button><button data-stage="1">加密</button><button data-stage="2">解密</button></nav><section data-demo="visualization"><svg viewBox="0 0 600 140" aria-label="公开密钥加密和私有密钥解密"><rect width="600" height="140" fill="#f0eff5"/><text x="20" y="70" id="diagram">消息 → 公钥 → 密文 → 私钥 → 消息</text></svg><div id="values"></div></section><section data-demo="controls"><div id="inputs"></div><button data-demo-action="apply">应用参数</button><button data-demo-action="previous">上一步</button><button data-demo-action="next">下一步</button><button data-demo-action="play">播放</button><button data-demo-action="reset">重置</button></section><section data-demo="experiment"><h2>只改变消息</h2><button data-demo-action="experiment">运行对照</button><div data-demo-experiment-result></div></section><section data-demo="quiz"><h2>检查理解</h2><fieldset data-demo-question><legend>公钥能否公开？</legend><label><input type="radio" name="q1" value="yes">能</label><label><input type="radio" name="q1" value="no">不能</label><button data-demo-action="check-answer">检查</button><p aria-live="polite"></p></fieldset><fieldset data-demo-question><legend>私钥是否应保密？</legend><label><input type="radio" name="q2" value="yes">应保密</label><label><input type="radio" name="q2" value="no">公开</label><button data-demo-action="check-answer">检查</button><p aria-live="polite"></p></fieldset></section><section data-demo="summary"><h2>教学边界</h2><p>小参数和裸 RSA 仅作教学。实际应用需要 OAEP、认证和混合加密。</p></section><script>
const defaults={p:'61',q:'53',e:'17',message:'65'};let inputs={...defaults},outputs={},step=0,playing=false,timer=null,experiment=null;
const prime=n=>{if(n<2n)return false;for(let i=2n;i*i<=n;i++)if(n%i===0n)return false;return true};
function pow(b,e,n){let r=1n;while(e){if(e&1n)r=r*b%n;b=b*b%n;e>>=1n}return r}
function calc(v){if(Object.values(v).some(s=>!/^\d{1,6}$/.test(s)))throw Error('请输入六位以内整数');let p=BigInt(v.p),q=BigInt(v.q),e=BigInt(v.e),m=BigInt(v.message),n=p*q,phi=(p-1n)*(q-1n);if(!prime(p)||!prime(q)||p===q||e<=1n||e>=phi||m>=n)throw Error('参数无效');let a=e,b=phi,x=1n,y=0n;while(b){let k=a/b;[a,b]=[b,a%b];[x,y]=[y,x-k*y]}if(a!==1n)throw Error('指数不互素');let d=(x%phi+phi)%phi,ciphertext=pow(m,e,n);return Object.fromEntries(Object.entries({n,phi,d,ciphertext,recovered:pow(ciphertext,d,n)}).map(([k,v])=>[k,String(v)]))}
const fields=document.querySelector('#inputs');for(const [key,value] of Object.entries(defaults)){let label=document.createElement('label');label.textContent=key;let input=document.createElement('input');input.dataset.demoInput=key;input.value=value;label.append(input);fields.append(label)}
function stop(){clearInterval(timer);timer=null;playing=false}
function render(){document.querySelector('#values').innerHTML=Object.entries(outputs).map(([k,v])=>'<label>'+k+' <output data-demo-value="'+k+'">'+v+'</output></label>').join('');document.querySelectorAll('[data-stage]').forEach((n,i)=>{if(i===step)n.setAttribute('aria-current','step');else n.removeAttribute('aria-current')});document.querySelector('[data-demo-action="previous"]').disabled=step===0;document.querySelector('[data-demo-action="next"]').disabled=step===2;for(const [k,v] of Object.entries(inputs))document.querySelector('[data-demo-input="'+k+'"]').value=v;document.querySelector('[data-demo-experiment-result]').innerHTML=experiment?['baseline','variant'].map(kind=>'<div>'+kind+Object.entries(experiment[kind]).map(([k,v])=>'<output data-demo-'+kind+'="'+k+'">'+v+'</output>').join('')+'</div>').join(''):'';document.querySelector('#diagram').textContent=['参数 → n, φ, d → 公私钥','消息 '+inputs.message+' → 公钥 → 密文 '+outputs.ciphertext,'密文 '+outputs.ciphertext+' → 私钥 → 消息 '+outputs.recovered][step]}
function setInputs(v){const next={...v},result=calc(next);stop();inputs=next;outputs=result;step=0;experiment=null;render()}
function move(delta){step=Math.max(0,Math.min(2,step+delta));if(step===2)stop();render()}
function reset(){setInputs(defaults);document.querySelectorAll('input[type="radio"]').forEach(n=>n.checked=false);document.querySelectorAll('[aria-live]').forEach(n=>n.textContent='')}
function runExperiment(){const variantInputs={...inputs,message:String((BigInt(inputs.message)+1n)%BigInt(outputs.n))};experiment={inputs:{...inputs},baseline:{...outputs},variantInputs,variant:calc(variantInputs)};render()}
const actions={apply:()=>setInputs(Object.fromEntries([...document.querySelectorAll('[data-demo-input]')].map(n=>[n.dataset.demoInput,n.value]))),previous:()=>move(-1),next:()=>move(1),play:()=>{stop();playing=true;timer=setInterval(()=>move(1),500)},reset,experiment:runExperiment};
document.querySelectorAll('[data-demo-action]').forEach(button=>button.addEventListener('click',()=>{const action=button.dataset.demoAction;if(action==='check-answer'){const q=button.closest('fieldset'),answer=q.querySelector('input:checked');q.querySelector('[aria-live]').textContent=answer?.value==='yes'?'正确：区分公开与秘密信息。':'请重新思考密钥的用途。'}else actions[action]?.()}));
window.aiseceduDemo={version:'teaching-demo-v1',snapshot:()=>structuredClone({step,stepCount:3,playing,inputs,outputs,experiment}),setInputs,step:move,reset,runExperiment};reset();
</script></body></html>
