<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE 安全实验：蓝牙低功耗中间人攻击</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card2: #1a2332;
            --border: #334155;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --blue: #3b82f6;
            --blue2: #1d4ed8;
            --red: #ef4444;
            --red2: #7f1d1d;
            --green: #22c55e;
            --amber: #f59e0b;
            --gold: #fbbf24;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .topbar {
            background: #0c1525;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar .title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #c8d6e5;
            white-space: nowrap;
        }
        .topbar .title .icon {
            color: var(--cyan);
            margin-right: 6px;
        }
        .step-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--card);
            border: 2px solid var(--border);
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text2);
            position: relative;
        }
        .step-dot.active {
            border-color: var(--blue);
            background: #1e3a5f;
            color: var(--blue);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
            animation: pulse-dot 2s infinite;
        }
        .step-dot.done {
            border-color: var(--green);
            background: #14532d;
            color: var(--green);
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
            }
        }
        .step-connector {
            width: 18px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
        }
        .step-connector.done {
            background: var(--green);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 16px;
            padding: 16px 20px;
            max-width: 1500px;
            margin: 0 auto;
            min-height: calc(100vh - 140px);
        }
        @media (max-width: 1100px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: #161f30;
            padding: 10px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            color: #b0bec5;
        }
        .panel-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-red {
            background: var(--red);
        }
        .dot-green {
            background: var(--green);
        }
        .dot-amber {
            background: var(--amber);
        }
        .packet-table-wrap {
            flex: 1;
            overflow-y: auto;
            max-height: 520px;
        }
        .packet-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }
        .packet-table th {
            background: #111827;
            padding: 8px 8px;
            text-align: left;
            font-weight: 600;
            color: #9ca3af;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }
        .packet-table td {
            padding: 7px 8px;
            border-bottom: 1px solid #1e2d3d;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .packet-table tr {
            transition: all 0.2s;
        }
        .packet-table tr:hover {
            background: #243447;
        }
        .packet-table tr.selected {
            background: #1e3a5f !important;
            outline: 1px solid var(--blue);
            outline-offset: -1px;
        }
        .packet-table tr.suspicious {
            background: #3b1a1a !important;
            border-left: 3px solid var(--red);
        }
        .packet-table tr.suspicious.selected {
            background: #4a1a2a !important;
            outline: 1px solid var(--red);
        }
        .packet-table tr.attacker-row {
            color: #fca5a5;
        }
        .packet-table .tag-btn {
            background: none;
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65rem;
            padding: 2px 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .packet-table .tag-btn.tagged {
            background: var(--red);
            color: #fff;
        }
        .packet-table .tag-btn:hover {
            background: var(--red2);
            color: #fff;
        }
        .packet-table .proto-tag {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .proto-adv {
            background: #1e3a2f;
            color: #4ade80;
        }
        .proto-smp {
            background: #3b2f1e;
            color: #fbbf24;
        }
        .proto-att {
            background: #1e2d4a;
            color: #60a5fa;
        }
        .proto-ll {
            background: #2d1e3a;
            color: #c084fc;
        }
        .right-panels {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        .detail-panel {
            flex: 1;
            min-height: 250px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .detail-tabs {
            display: flex;
            background: #161f30;
            border-bottom: 1px solid var(--border);
        }
        .detail-tab {
            padding: 9px 16px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8b9cb5;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .detail-tab.active {
            color: var(--cyan);
            border-bottom-color: var(--cyan);
        }
        .detail-tab:hover {
            color: #c8d6e5;
        }
        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.6;
        }
        .field-row {
            display: flex;
            padding: 3px 0;
            border-bottom: 1px dotted #1e3040;
        }
        .field-name {
            color: #60a5fa;
            min-width: 140px;
            font-weight: 600;
        }
        .field-value {
            color: #c8d6e5;
            word-break: break-all;
        }
        .field-value.highlight {
            color: var(--amber);
            font-weight: 700;
        }
        .hex-dump {
            display: flex;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            line-height: 1.55;
        }
        .hex-offset {
            color: #6b7280;
            min-width: 50px;
            text-align: right;
        }
        .hex-bytes {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            max-width: 340px;
        }
        .hex-byte {
            color: #b0bec5;
            cursor: default;
            padding: 0 1px;
            border-radius: 2px;
        }
        .hex-byte.hl {
            background: #5a3e0a;
            color: var(--amber);
            font-weight: 700;
        }
        .hex-ascii {
            color: #6ee7b7;
            letter-spacing: 1px;
        }
        .workspace {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .workspace h3 {
            font-size: 0.9rem;
            color: #c8d6e5;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1e3040;
            color: #c8d6e5;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #2a4055;
            border-color: #556980;
        }
        .btn-primary {
            background: var(--blue2);
            border-color: var(--blue);
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        .btn-danger {
            background: #7f1d1d;
            border-color: var(--red);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: #991b1b;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        .btn-success {
            background: #14532d;
            border-color: var(--green);
            color: #86efac;
        }
        .btn-success:hover {
            background: #166534;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }
        textarea,
        input[type="text"] {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #c8d6e5;
            padding: 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            width: 100%;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }
        .topology-svg {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 0 auto;
            display: block;
        }
        .flag-box {
            background: #1a1a0a;
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--gold);
            letter-spacing: 1px;
            animation: glow-flag 1.5s infinite alternate;
        }
        @keyframes glow-flag {
            0% {
                box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
            }
            100% {
                box-shadow: 0 0 24px rgba(251, 191, 36, 0.7);
            }
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 999;
            animation: slide-in 0.4s ease-out;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .toast.success {
            background: #14532d;
            border: 1px solid var(--green);
            color: #86efac;
        }
        .toast.error {
            background: #7f1d1d;
            border: 1px solid var(--red);
            color: #fca5a5;
        }
        .toast.info {
            background: #1e3a5f;
            border: 1px solid var(--blue);
            color: #93c5fd;
        }
        @keyframes slide-in {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .badge-danger {
            background: #7f1d1d;
            color: #fca5a5;
        }
        .badge-safe {
            background: #14532d;
            color: #86efac;
        }
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .comparison-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.78rem;
        }
        .comparison-card.insecure {
            border-left: 3px solid var(--red);
        }
        .comparison-card.secure {
            border-left: 3px solid var(--green);
        }
        .comparison-card h4 {
            margin-bottom: 6px;
            font-size: 0.82rem;
        }
        .lock-animation {
            font-size: 3rem;
            text-align: center;
            transition: all 0.5s;
        }
        .lock-animation.unlocked {
            color: var(--green);
            animation: unlock-bounce 0.6s ease-out;
        }
        @keyframes unlock-bounce {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.3);
            }
            60% {
                transform: scale(0.9);
            }
        }
        .timeline {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px 0;
        }
        .timeline-node {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
            background: #1a2332;
        }
        .timeline-node.active-step {
            border-color: var(--cyan);
            background: #0d3338;
            color: var(--cyan);
        }
        .timeline-arrow {
            color: #556980;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <!-- EDUCATIONAL PURPOSE ONLY — authorized classroom use -->
    <div class="topbar">
        <span class="title"><span class="icon">🔐</span>BLE 安全实验：蓝牙低功耗中间人攻击</span>
        <div class="step-indicator" id="stepIndicator">
            <span class="step-dot active" data-step="1" title="设备发现">1</span><span class="step-connector"></span>

    <div class="main-grid">
        <!-- LEFT: Packet List -->
        <div class="panel">
            <div class="panel-header"><span class="dot dot-green"></span>BLE 数据包捕获 (Wireshark 式视图)</div>
            <div class="packet-table-wrap">
                <table class="packet-table" id="packetTable">
                    <thead>
                        <tr><th>No.</th><th>时间</th><th>源地址</th><th>目标地址</th><th>协议</th><th>长度</th><th>信息</th><th>标记</th></tr>
                    </thead>

        <!-- RIGHT: Detail + Workspace -->
        <div class="right-panels">

            <div class="detail-panel">

                </div>
            </div>

            <!-- Workspace -->
            <div class="workspace" id="workspace">
                <h3>🛠️ 当前任务</h3>
                <div id="workspaceContent">

                    <p style="color:#6b7280;font-size:0.75rem;">提示：寻找设备名称为 "SmartLock" 的广播包。</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>

        (function() {

                    info: '连接请求: PhoneApp → SmartLock',

                { id: 5, time: '0.680', src: 'BB:CC:DD:EE:FF:02', dst: 'AA:BB:CC:DD:EE:01', proto: 'SMP', len: 15,
                    info: '配对请求: Just Works, No MITM, No Bonding',

                    if (state.selectedPacketId === p.id) tr.classList.add('selected');
                    let protoClass = 'proto-adv';
                    if (p.proto === 'SMP') protoClass = 'proto-smp';
                    else if (p.proto === 'ATT') protoClass = 'proto-att';
                    else if (p.proto === 'LL_CONN') protoClass = 'proto-ll';
                    const tagLabel = state.taggedPackets.has(p.id) ? '已标记' : '标记';
                    const tagClass = state.taggedPackets.has(p.id) ? 'tag-btn tagged' : 'tag-btn';
                    tr.innerHTML = `
                <td>${p.id}</td>
                <td>${p.time}</td>
                <td style="color:${p.isAttacker?'#fca5a5':'#b0bec5'};">${p.src}</td>
                <td style="color:${p.isAttacker?'#fca5a5':'#b0bec5'};">${p.dst}</td>
                <td><span class="proto-tag ${protoClass}">${p.proto}</span></td>
                <td>${p.len}</td>

                if (state.selectedPacketId === pId) updateDetailPanel();

                  <span id="ltkObserveFeedback" style="margin-left:8px;font-size:0.75rem;"></span>
                </div>`;
                } else if (step === 3) {
                    const taggedCount = state.taggedPackets.size;
                    html = `
                <p style="color:#ef4444;">🚨 <strong>任务：MITM攻击检测</strong> — 攻击者数据包已混入捕获列表(#13-#20)。</p>
                <p style="color:#94a3b8;">请标记所有涉及攻击者 (MAC: CC:DD:EE:FF:AA:99) 的可疑数据包。</p>
                <p style="color:#6b7280;font-size:0.75rem;">在左侧数据包列表中点击"标记"按钮。已标记：<strong>${taggedCount}</strong> 个</p>
                <button class="btn btn-danger" onclick="verifyTagging()">🔍 验证分析</button>
                <span id="taggingFeedback" style="margin-left:8px;font-size:0.8rem;"></span>
                <div id="taggingResult" style="margin-top:8px;"></div>`;
                } else if (step === 4) {
                    html = `
                <p style="color:#f59e0b;">🎯 <strong>任务：执行重放攻击</strong> — 使用捕获的LTK构造恶意解锁命令。</p>
                <p style="color:#94a3b8;font-size:0.78rem;">攻击者已捕获 LTK: <code style="color:#fbbf24;">0xB47F2A91E3550CD8661F4E7B9A2D83F0</code></p>
                <div style="background:#0f172a;border-radius:6px;padding:10px;margin-top:6px;">
                  <label style="font-size:0.75rem;color:#8899aa;">目标设备MAC:</label>
                  <input type="text" id="replayTarget" value="AA:BB:CC:DD:EE:01" readonly style="margin-bottom:6px;">
                  <label style="font-size:0.75rem;color:#8899aa;">GATT Handle (锁控制):</label>
                  <input type="text" id="replayHandle" placeholder="输入Handle (提示: 数据包#11)" style="margin-bottom:6px;">
                  <label style="font-size:0.75rem;color:#8899aa;">写入值 (0x01=解锁):</label>
                  <input type="text" id="replayValue" placeholder="输入解锁命令值" style="margin-bottom:8px;">
                  <button class="btn btn-danger" onclick="executeReplay()">💥 执行重放攻击</button>
                  <span id="replayFeedback" style="margin-left:8px;font-size:0.8rem;"></span>
                </div>
                <div id="replayResult" style="margin-top:8px;text-align:center;"></div>`;
                } else if (step === 5) {
                    html = `
                <p style="color:#22c55e;">🛡️ <strong>任务：Passkey安全对比</strong> — 数据包#21-#24展示安全配对。</p>
                <div class="comparison-grid">
                  <div class="comparison-card insecure">
                    <h4>❌ Just Works (数据包#5-#8)</h4>
                    <p style="font-size:0.7rem;color:#fca5a5;">TK = 0x000...000 (全零)</p>
                    <p style="font-size:0.7rem;color:#fca5a5;">AuthReq MITM标志 = 0x00</p>
                    <p style="font-size:0.7rem;color:#fca5a5;">无用户交互验证</p>
                    <p style="font-size:0.7rem;color:#fca5a5;">攻击者可中继并解密</p>
                  </div>
                  <div class="comparison-card secure">
                    <h4>✅ Passkey (数据包#21-#24)</h4>
                    <p style="font-size:0.7rem;color:#86efac;">6位随机Passkey</p>
                    <p style="font-size:0.7rem;color:#86efac;">AuthReq MITM标志 = 0x0D</p>
                    <p style="font-size:0.7rem;color:#86efac;">数值比较(Numeric Comparison)</p>
                    <p style="font-size:0.7rem;color:#86efac;">ECDH + 用户确认 → MITM防护</p>
                  </div>
                </div>`;
                } else if (step === 6) {
                    html = `
                <p style="color:#fbbf24;">🏁 <strong>最终任务：分析报告 & 捕获Flag</strong></p>
                <p style="color:#94a3b8;font-size:0.78rem;">请撰写一段分析，说明：攻击如何发生、利用了哪个漏洞、如何防御。</p>
                <textarea id="analysisInput" rows="4" placeholder="在此输入你的安全分析报告...&#10;例如：本次MITM攻击利用了Just Works配对的TK=0漏洞..."></textarea>
                <button class="btn btn-success" onclick="submitAnalysis()">📝 提交分析</button>
                <span id="analysisFeedback" style="margin-left:8px;font-size:0.8rem;"></span>
                <div id="flagContainer" style="margin-top:10px;"></div>`;
                }
                workspaceContent.innerHTML = html;
            }

            // ============ STEP NAVIGATION ============
            function goToStep(stepNum) {
                if (stepNum < 1 || stepNum > 6) return;
                if (stepNum > 1 && !state.stepsCompleted.has(stepNum - 1)) {
                    showToast('请先完成当前步骤', 'info');
                    return;
                }
                state.currentStep = stepNum;
                state.stepsCompleted.add(stepNum);
                updateStepIndicator();
                updateWorkspace();
                updateProgressLabel();
                if (stepNum >= 3 && state.selectedPacketId === null) {
                    selectPacket(stepNum >= 3 ? 13 : 1);
                }
            }

            function updateStepIndicator() {
                const dots = stepIndicator.querySelectorAll('.step-dot');
                dots.forEach(d => {
                    const s = parseInt(d.getAttribute('data-step'));
                    d.classList.remove('active', 'done');
                    if (s === state.currentStep) d.classList.add('active');
                    else if (state.stepsCompleted.has(s)) d.classList.add('done');
                });
                const connectors = stepIndicator.querySelectorAll('.step-connector');
                connectors.forEach((c, i) => {
                    if (state.stepsCompleted.has(i + 2)) c.classList.add('done');
                    else c.classList.remove('done');
                });
            }

            function updateProgressLabel() {
                progressLabel.textContent = `步骤 ${state.currentStep}/6 — ${['设备发现','Just Works配对观察','MITM攻击检测','重放攻击执行','Passkey安全对比','分析与Flag捕获'][state.currentStep-1]}`;
            }

            // ============ CHECK FUNCTIONS ============
            window.checkLockMac = function() {
                const input = document.getElementById('lockMacInput').value.trim().toUpperCase();
                const fb = document.getElementById('lockMacFeedback');
                if (input === 'AA:BB:CC:DD:EE:01') {
                    fb.innerHTML = '<span style="color:#22c55e;">✅ 正确！智能锁MAC: AA:BB:CC:DD:EE:01</span>';
                    showToast('设备发现完成！进入下一步', 'success');
                    state.stepsCompleted.add(2);
                    setTimeout(() => goToStep(2), 800);
                } else if (input.includes('AA:BB')) {
                    fb.innerHTML = '<span style="color:#f59e0b;">接近了！检查完整地址格式</span>';
                } else {
                    fb.innerHTML = '<span style="color:#ef4444;">❌ 不对，请查看数据包#1的AdvA字段</span>';
                }
            };

            window.checkLtkObserve = function() {
                const input = document.getElementById('ltkObserveInput').value.trim().toUpperCase().replace(/\s+/g, '');
                const fb = document.getElementById('ltkObserveFeedback');
                if (input.startsWith('B47F2A91') || input === 'B47F2A91E3550CD8661F4E7B9A2D83F0') {
                    fb.innerHTML = '<span style="color:#22c55e;">✅ 正确！LTK已识别</span>';
                    showToast('配对分析完成！注意Just Works的脆弱性', 'success');
                    state.stepsCompleted.add(3);
                    setTimeout(() => goToStep(3), 800);
                } else if (input.length >= 6) {
                    fb.innerHTML = '<span style="color:#f59e0b;">格式正确但值不对，再检查数据包#7</span>';
                } else {
                    fb.innerHTML = '<span style="color:#ef4444;">请输入LTK前8位</span>';
                }
            };

            window.verifyTagging = function() {
                const fb = document.getElementById('taggingFeedback');
                const resultDiv = document.getElementById('taggingResult');
                const groundTruth = new Set([13, 14, 15, 16, 17, 18, 19, 20]);
                let correct = 0;
                let missed = [];
                let falsePos = [];
                groundTruth.forEach(id => {
                    if (state.taggedPackets.has(id)) correct++;
                    else missed.push(id);
                });
                state.taggedPackets.forEach(id => {
                    if (!groundTruth.has(id)) falsePos.push(id);
                });
                let msg = '';
                if (correct >= 6 && falsePos.length <= 1) {
                    msg =
                        '<span style="color:#22c55e;">✅ 优秀！你成功识别了MITM攻击包 (标记 ' + correct + '/8 个攻击包)</span>';
                    fb.innerHTML = msg;
                    resultDiv.innerHTML =
                        '<div style="padding:8px;background:#14532d;border-radius:4px;color:#86efac;font-size:0.75rem;">🎯 关键发现：攻击者MAC CC:DD:EE:FF:AA:99 中继了配对过程并捕获了LTK</div>';
                    state.stepsCompleted.add(4);
                    showToast('MITM检测完成！', 'success');
                    setTimeout(() => goToStep(4), 1000);
                } else {
                    msg = '<span style="color:#f59e0b;">⚠️ 标记了 ' + correct + '/8 个攻击包';
                    if (missed.length > 0) msg += ' | 漏检: #' + missed.join(',#');
                    if (falsePos.length > 0) msg += ' | 误报: #' + falsePos.join(',#');
                    msg += '</span>';
                    fb.innerHTML = msg;
                    resultDiv.innerHTML =
                        '<div style="padding:8px;background:#3b1a1a;border-radius:4px;color:#fca5a5;font-size:0.75rem;">💡 提示：关注MAC地址为 CC:DD:EE:FF:AA:99 的所有数据包(#13-#20)</div>';
                }
            };

            window.executeReplay = function() {
                const handle = document.getElementById('replayHandle').value.trim();
                const value = document.getElementById('replayValue').value.trim();
                const fb = document.getElementById('replayFeedback');
                const resultDiv = document.getElementById('replayResult');
                if (handle === '0x0026' && (value === '0x01' || value === '01' || value === '1')) {
                    fb.innerHTML = '<span style="color:#22c55e;">✅ 重放攻击成功！锁已解锁 🔓</span>';
                    resultDiv.innerHTML =
                        '<div class="lock-animation unlocked">🔓</div><p style="color:#22c55e;font-weight:700;">FLAG 第一部分: BLE_MITM</p><p style="color:#fca5a5;font-size:0.75rem;">攻击者使用捕获的LTK成功发送了恶意解锁命令！</p>';
                    state.replayCompleted = true;
                    state.stepsCompleted.add(5);
                    showToast('重放攻击成功执行！', 'success');
                    setTimeout(() => goToStep(5), 1200);
                } else if (handle === '0x0026' || value === '0x01' || value === '01') {
                    fb.innerHTML =
                        '<span style="color:#f59e0b;">部分正确！Handle应为0x0026，Value应为0x01（参考数据包#11）</span>';
                } else {
                    fb.innerHTML = '<span style="color:#ef4444;">❌ 参数错误，请检查Handle和Value</span>';
                }
            };

            window.submitAnalysis = function() {
                const input = document.getElementById('analysisInput').value.trim();
                const fb = document.getElementById('analysisFeedback');
                const flagContainer = document.getElementById('flagContainer');
                const keywords = ['just works', 'justworks', 'tk=0', 'tk = 0', 'mitm', '中间人', '中继', '重放',
                    'replay', 'ltk', 'passkey', '数值比较', 'numeric comparison', 'authreq', '0x00', '配对',
                    '加密密钥', '广播包', '伪装'
                ];
                const found = keywords.filter(kw => input.toLowerCase().includes(kw.toLowerCase()));
                if (found.length >= 4) {
                    fb.innerHTML =
                        '<span style="color:#22c55e;">✅ 分析深刻！命中关键词: ' + found.join(', ') + '</span>';
                    state.flagRevealed = true;
                    state.analysisSubmitted = true;
                    state.stepsCompleted.add(6);
                    flagContainer.innerHTML =
                        '<div class="flag-box">🏆 FLAG: FLAG{BLE_JUST_WORKS_MITM_REPLAY_2024}</div>';
                    flagContainer.innerHTML +=
                        '<p style="color:#86efac;font-size:0.78rem;margin-top:6px;">🎉 恭喜！你已完成全部实验。Just Works配对因TK=0而极易遭受MITM攻击，务必在生产环境中使用Passkey或OOB配对。</p>';
                    updateStepIndicator();
                    updateProgressLabel();
                    showToast('🏆 Flag 已捕获！', 'success');
                } else if (found.length >= 2) {
                    fb.innerHTML = '<span style="color:#f59e0b;">还不错！尝试覆盖更多安全要点（已命中: ' + found.join(
                        ', ') + '）</span>';
                } else {
                    fb.innerHTML = '<span style="color:#ef4444;">分析不够全面，请提及Just Works漏洞、MITM中继、LTK捕获和Passkey防御</span>';
                }
            };

            // ============ TOAST ============
            function showToast(msg, type) {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(120%)';
                    toast.style.transition = 'all 0.4s';
                    setTimeout(() => toast.remove(), 400);
                }, 2500);
            }

            // ============ TAB SWITCHING ============
            document.querySelectorAll('.detail-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove(
                        'active'));
                    this.classList.add('active');
                    state.activeDetailTab = this.getAttribute('data-tab');
                    updateDetailPanel();
                });
            });

            // ============ STEP DOT CLICKS ============
            stepIndicator.querySelectorAll('.step-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const s = parseInt(this.getAttribute('data-step'));
                    if (state.stepsCompleted.has(s) || s === state.currentStep + 1 && state
                        .stepsCompleted.has(s - 1)) {
                        goToStep(s);
                    } else if (s > state.currentStep) {
                        showToast('请先完成当前步骤', 'info');
                    } else {
                        goToStep(s);
                    }
                });
            });

            // ============ INIT ============
            function init() {
                renderPacketTable();
                updateStepIndicator();
                updateWorkspace();
                updateProgressLabel();
                selectPacket(1);
                totalPacketsSpan.textContent = packets.length;
            }

            init();
            console.log(
                '// EDUCATIONAL PURPOSE ONLY — authorized classroom use\n// BLE安全实验已就绪 — 共' + packets.length +
                '个数据包，6个实验步骤');
        })();
    </script>
</body>
</html>
