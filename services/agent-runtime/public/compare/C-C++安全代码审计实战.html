<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C/C++ 安全代码审计实战 — 交互式实验室</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1a1a2e;
            --surface2: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --danger-bg: #3b1018;
            --success: #22c55e;
            --success-bg: #0a2e1a;
            --warning: #f59e0b;
            --warning-bg: #2e2000;
            --amber: #f59e0b;
            --code-bg: #0d1117;
            --line-hover: #1e3a5f;
            --line-select: #2a1a3a;
            --line-danger: #3b1018;
            --line-warning: #2e2000;
            --line-success: #0a2e1a;
            --radius: 8px;
            --radius-sm: 4px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
            --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 28px 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            color: var(--text2);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .edu-note {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #64748b;
            font-family: var(--font-mono);
            background: var(--surface2);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.02em;
        }

        /* Briefing card */
        .briefing {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .briefing .icon {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .briefing .content h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }
        .briefing .content p {
            color: var(--text2);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Progress */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .progress-wrap .label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .progress-bar-outer {
            flex: 1;
            min-width: 150px;
            height: 8px;
            background: var(--surface2);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .progress-count {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent);
            white-space: nowrap;
        }
        .progress-dots {
            display: flex;
            gap: 6px;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            transition: background var(--transition), transform var(--transition);
        }
        .progress-dot.done {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            transform: scale(1.2);
        }
        .progress-dot.current {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 4px rgba(59, 130, 246, 0.4);
            }
            50% {
                box-shadow: 0 0 14px rgba(59, 130, 246, 0.8);
            }
        }

        /* Tab nav */
        .tab-nav {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all var(--transition);
            white-space: nowrap;
            position: relative;
            font-family: var(--font-sans);
        }
        .tab-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
        .tab-btn .check-mark {
            display: inline-block;
            margin-left: 4px;
            color: var(--success);
            font-weight: 700;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .tab-btn.done .check-mark {
            opacity: 1;
        }
        .tab-btn.done {
            color: var(--success);
            border: 1px solid transparent;
        }
        .tab-btn.done.active {
            color: #fff;
            background: #15803d;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }

        /* Main card */
        .main-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color var(--transition);
        }
        .main-card.solved {
            border-color: var(--success);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.15);
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-header .vuln-title {
            font-weight: 700;
            font-size: 1rem;
        }
        .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            font-family: var(--font-mono);
        }
        .badge-cwe {
            background: #3b1018;
            color: #fca5a5;
        }
        .badge-cert {
            background: #0a2e1a;
            color: #86efac;
        }
        .badge-severity {
            background: #2e2000;
            color: #fde68a;
        }

        /* Code display area */
        .code-section-label {
            font-size: 0.78rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 20px 6px;
            font-weight: 600;
        }
        .code-display {
            margin: 0 16px 12px;
            background: var(--code-bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            user-select: none;
        }
        .code-line {
            display: flex;
            align-items: flex-start;
            padding: 3px 0;
            cursor: pointer;
            transition: background 0.15s ease;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.55;
            position: relative;
        }
        .code-line:hover {
            background: var(--line-hover);
        }
        .code-line .ln {
            width: 46px;
            min-width: 46px;
            text-align: right;
            padding-right: 14px;
            color: #545d6e;
            user-select: none;
            font-size: 0.76rem;
            flex-shrink: 0;
        }
        .code-line .code-text {
            white-space: pre;
            color: #c9d1d9;
            flex: 1;
            padding-right: 12px;
        }
        .code-line.highlight-danger {
            background: var(--line-danger);
            border-left: 3px solid var(--danger);
        }
        .code-line.highlight-warning {
            background: var(--line-warning);
            border-left: 3px solid var(--warning);
        }
        .code-line.highlight-success {
            background: var(--line-success);
            border-left: 3px solid var(--success);
        }
        .code-line.clicked-wrong {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        /* Annotation tooltip */
        .annotation {
            margin: 8px 16px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .annotation.show {
            display: block;
        }
        .annotation.danger {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .annotation.warning {
            background: var(--warning-bg);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fde68a;
        }
        .annotation.success {
            background: var(--success-bg);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fix editor */
        .editor-section {
            padding: 0 16px 16px;
        }
        .editor-section .section-label {
            font-size: 0.78rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }
        .fix-editor {
            width: 100%;
            min-height: 180px;
            background: var(--code-bg);
            color: #c9d1d9;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.55;
            resize: vertical;
            transition: border-color var(--transition);
            tab-size: 4;
            outline: none;
        }
        .fix-editor:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .fix-editor.correct {
            border-color: var(--success) !important;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12) !important;
        }
        .fix-editor.incorrect {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12) !important;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            border-color: #64748b;
            color: var(--text);
        }
        .btn-hint {
            background: transparent;
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .btn-hint:hover {
            background: var(--warning-bg);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Result panel */
        .result-panel {
            margin: 12px 16px 16px;
            padding: 16px;
            border-radius: var(--radius-sm);
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .result-panel.show {
            display: block;
        }
        .result-panel.pass {
            background: var(--success-bg);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .result-panel.fail {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .result-panel h4 {
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .result-panel .detail {
            font-size: 0.8rem;
            color: var(--text2);
            font-family: var(--font-mono);
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* Diff display */
        .diff-display {
            margin: 12px 16px 16px;
            display: none;
            gap: 12px;
            animation: fadeIn 0.35s ease;
        }
        .diff-display.show {
            display: flex;
            flex-wrap: wrap;
        }
        .diff-col {
            flex: 1;
            min-width: 280px;
            background: var(--code-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .diff-col .diff-header {
            padding: 8px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .diff-col.orig .diff-header {
            background: #3b1018;
            color: #fca5a5;
        }
        .diff-col.fixed .diff-header {
            background: #0a2e1a;
            color: #86efac;
        }
        .diff-col pre {
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            line-height: 1.5;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        /* Flag reveal */
        .flag-reveal {
            margin: 20px 16px 16px;
            padding: 20px;
            background: #1a1200;
            border: 2px dashed var(--amber);
            border-radius: var(--radius);
            text-align: center;
            display: none;
            animation: pulseFlag 0.6s ease;
        }
        .flag-reveal.show {
            display: block;
        }
        .flag-reveal .flag-text {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--amber);
            letter-spacing: 0.04em;
            word-break: break-all;
        }
        @keyframes pulseFlag {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            60% {
                transform: scale(1.03);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Analysis toggle */
        .analysis-toggle {
            margin: 8px 16px 16px;
        }
        .analysis-content {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 8px;
            font-size: 0.84rem;
            line-height: 1.6;
            display: none;
        }
        .analysis-content.open {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .analysis-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .analysis-content th,
        .analysis-content td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .analysis-content th {
            color: var(--text2);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.7rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 999;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.2s forwards;
            pointer-events: none;
        }
        .toast.success {
            background: #15803d;
            color: #fff;
        }
        .toast.info {
            background: #1d4ed8;
            color: #fff;
        }
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                padding: 12px 10px 40px;
            }
            .tab-btn {
                font-size: 0.72rem;
                padding: 8px 6px;
            }
            .code-line {
                font-size: 0.7rem;
            }
            .code-line .ln {
                width: 32px;
                min-width: 32px;
                padding-right: 8px;
                font-size: 0.66rem;
            }
            .fix-editor {
                min-height: 140px;
                font-size: 0.72rem;
            }
            .diff-display.show {
                flex-direction: column;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 C/C++ 安全代码审计实战</h1>
            <p class="subtitle">定位漏洞 → 编写修复 → 掌握安全编码最佳实践</p>
            <span class="edu-note">// EDUCATIONAL PURPOSE ONLY — authorized classroom use</span>
        </div>

        <!-- Briefing -->
        <div class="briefing">
            <span class="icon">📋</span>
            <div class="content">
                <h3>任务简报</h3>
                <p>你是一名安全审计工程师。以下5段C/C++代码片段各包含一个典型的安全漏洞。你的任务是：<br>
                <strong>① 点击</strong>你认为存在漏洞的代码行 → <strong>② 在编辑器中编写修复代码</strong> → <strong>③ 提交验证</strong>，通过模式匹配确认修复是否安全。<br>
                全部修复完成后，将揭示隐藏的FLAG。参考标准：<strong>CWE</strong> 和 <strong>CERT C Secure Coding</strong>。</p>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
            <span class="label">审计进度</span>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
            </div>
            <span class="progress-count" id="progressCount">0 / 5</span>
            <div class="progress-dots" id="progressDots">
                <span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span>
            </div>
        </div>

        <!-- Tab nav -->
        <div class="tab-nav" id="tabNav">
            <button class="tab-btn active" data-idx="0">漏洞1 · gets()<span class="check-mark"> ✓</span></button>
            <button class="tab-btn" data-idx="1">漏洞2 · system()<span class="check-mark"> ✓</span></button>
            <button class="tab-btn" data-idx="2">漏洞3 · rand()<span class="check-mark"> ✓</span></button>
            <button class="tab-btn" data-idx="3">漏洞4 · 整数溢出<span class="check-mark"> ✓</span></button>
            <button class="tab-btn" data-idx="4">漏洞5 · TOCTOU<span class="check-mark"> ✓</span></button>
        </div>

        <!-- Main card -->
        <div class="main-card" id="mainCard">
            <!-- Dynamically filled -->
        </div>

        <!-- Global flag reveal -->
        <div class="flag-reveal" id="globalFlag">
            <p style="color:#fde68a;font-weight:600;margin-bottom:8px;">🏆 全部漏洞修复完成！</p>
            <span class="flag-text" id="globalFlagText"></span>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script>
        (function() {
            // ─────────────────────────────────────
            // Vulnerability definitions
            // ─────────────────────────────────────
            const vulnData = [{
                id: 0,
                title: '漏洞1：gets() 缓冲区溢出',
                cwe: 'CWE-119',
                cert: 'CERT C STR31-C',
                severity: '高危',
                vulnLineIdx: [6], // 0-indexed lines that are the PRIMARY vulnerability
                relatedLineIdx: [3], // secondary concern
                codeLines: [
                    '#include <stdio.h>',
                    '#include <string.h>',
                    '',
                    'void process_input() {',
                    '    char buffer[64];',
                    '    printf("Enter your name: ");',
                    '    gets(buffer);  // ← 危险：无边界检查',
                    '    printf("Hello, %s!\\n", buffer);',
                    '}',
                    '',
                    'int main() {',
                    '    process_input();',
                    '    return 0;',
                    '}',
                ],
                safePatterns: [
                    { pattern: /fgets\s*\(/, required: true, desc: '使用 fgets() 替代 gets()' },
                    { pattern: /sizeof\s*\(\s*buffer\s*\)/, required: true,
                    desc: '使用 sizeof(buffer) 限制读取长度' },
                    { pattern: /gets\s*\(/, required: false, forbidden: true, desc: '不应再出现 gets() 调用' },
                ],

                }
                // For vuln 4: check for overflow guard
                if (idx === 3 && /size_t/.test(userCode) && !/(SIZE_MAX|ULONG_MAX|if\s*\(.*>)/.test(userCode)) {
                    allPassed = false;
                    feedbackLines.push('⚠️ 使用了size_t但缺少溢出检查条件（如 count > SIZE_MAX / sizeof(...)）。');
                }
                // For vuln 5: check access still present
                if (idx === 4 && /\baccess\s*\(/.test(userCode)) {
                    allPassed = false;
                    feedbackLines.push('⚠️ 仍保留了access()调用，TOCTOU窗口依然存在。');
                }

                // Show result
                resultPanel.classList.add('show');
                if (allPassed) {
                    resultPanel.className = 'result-panel pass show';
                    resultPanel.innerHTML = '<h4>✅ 修复验证通过！</h4><div class="detail">' + feedbackLines.join('\n') +
                        '</div>';
                    editor.classList.add('correct');
                    editor.classList.remove('incorrect');
                    solvedFlags[idx] = true;
                    fixSubmitted[idx] = true;
                    document.getElementById('annotation').className = 'annotation success show';
                    document.getElementById('annotation').innerHTML =
                    '<strong>✅ 修复成功！</strong>该漏洞已通过安全模式验证。';
                    showToast('🎉 漏洞' + (idx + 1) + '修复成功！', 'success');
                    // Re-render to update badge
                    setTimeout(() => renderVuln(idx), 600);
                } else {
                    resultPanel.className = 'result-panel fail show';
                    resultPanel.innerHTML = '<h4>❌ 修复未通过</h4><div class="detail">' + feedbackLines.join('\n') +
                        '</div>';
                    editor.classList.add('incorrect');
                    editor.classList.remove('correct');
                }

                // Show diff
                diffDisplay.classList.add('show');
                diffOrig.textContent = v.codeLines.join('\n');
                diffFixed.textContent = userCode;

                updateProgress();
            }

            // ─────────────────────────────────────
            // Tab navigation
            // ─────────────────────────────────────
            allTabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-idx'));
                    if (idx === currentIdx && mainCard.innerHTML) return;
                    renderVuln(idx);
                });
            });

            // ─────────────────────────────────────
            // Keyboard shortcuts
            // ─────────────────────────────────────
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key >= '1' && e.key <= '5') {
                    e.preventDefault();
                    const idx = parseInt(e.key) - 1;
                    renderVuln(idx);
                }
                // Ctrl+Enter to submit
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    validateFix(currentIdx);
                }
            });

            // ─────────────────────────────────────
            // Initial render
            // ─────────────────────────────────────
            renderVuln(0);
            updateProgress();

            // Show initial toast
            setTimeout(() => showToast('👆 点击代码中你认为存在漏洞的行，开始审计！', 'info'), 500);

            console.log('// EDUCATIONAL PURPOSE ONLY — authorized classroom use');
            console.log('// C/C++ 安全代码审计实战实验室已就绪');
            console.log('// 5个漏洞：gets()溢出 | system()注入 | rand()弱随机 | 整数溢出 | TOCTOU');
            console.log('// 快捷键：Ctrl+1~5 切换漏洞 | Ctrl+Enter 提交修复');
        })();
    </script>
</body>
