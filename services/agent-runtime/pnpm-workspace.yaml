packages:
  - "packages/*"
  - "packages/@openmaic/*"
  - "!packages/docs" # standalone docs sub-app: own lockfile, build, deploy
allowBuilds:
  '@alicloud/openapi-core': true
  '@biomejs/biome': false
  '@google/genai': false
  '@scarf/scarf': false
  canvas: true
  core-js: true
  es5-ext: true
  esbuild: true
  msw: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
