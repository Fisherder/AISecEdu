server {
    include /etc/nginx/conf.d/workspace.conf;
    listen 4443 ssl;
    http2 on;
    error_page 497 = @workspace_plain_http;

    ssl_certificate /etc/nginx/local-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/local-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location @workspace_plain_http {
        if ($aisecedu_http_redirect) {
            return 308 https://$http_host$request_uri;
        }
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:14443;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /trust-check {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "玄甲 Workspace TLS is trusted and reachable\n";
    }
}

server {
    listen 127.0.0.1:14443;
    include /etc/nginx/conf.d/workspace.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /trust-check {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "玄甲 Workspace HTTP is reachable\n";
    }
}
