server {
    include /etc/nginx/conf.d/dojo-host.conf;
    listen 80 default_server;
    include /etc/nginx/conf.d/public-origin.conf;

    if ($aisecedu_http_redirect) {
        return 307 $aisecedu_public_origin$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /lan-health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "玄甲 LAN endpoint ready\n";
    }

    location = /local-tls.crt {
        alias /usr/share/nginx/html/pwncollege-local-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition 'attachment; filename="pwncollege-local-ca.crt"';
    }

    location = /workspace-trust {
        return 307 http://$host:4443/trust-check;
    }

    include /etc/nginx/conf.d/proxy-headers.conf;
    include /etc/nginx/conf.d/location-*.conf;
}
