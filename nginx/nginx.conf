user  nginx;
worker_processes auto;

load_module modules/ngx_http_acme_module.so;
load_module modules/ngx_http_hmac_secure_link_module.so;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log query strings or referrers: launch tickets and user-provided
    # prompts can appear there. Method + normalized URI retains useful routing
    # diagnostics without copying credentials or private content into logs.
    log_format main escape=json '{"time_local":"$time_iso8601","client_ip":"$http_x_forwarded_for","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","protocol":"$server_protocol","status":"$status","body_bytes_sent":"$body_bytes_sent","request_time":"$request_time","upstream_response_time":"$upstream_response_time","upstream_bytes_received":"$upstream_bytes_received","gzip_ratio":"$gzip_ratio","upstream_addr":"$upstream_addr","http_user_agent":"$http_user_agent","request_id":"$request_id"}';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/json application/xml application/xml+rss image/svg+xml text/css text/javascript text/plain text/xml;

    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;

    map $http_upgrade $proxy_connection {
        ~*websocket upgrade;
        default '';
    }

    map "$arg_v$arg_d" $theme_cache_control {
        "" "public, max-age=86400, stale-while-revalidate=604800";
        default "public, max-age=31536000, immutable";
    }

    map $host $canonical_dojo_host {
        ~^future\.(?<dojo_host>.+)$ $dojo_host;
        default $host;
    }

    map $http_cookie $workspace_cookie {
        default $http_cookie;
        "~^__Host-aisecedu-session=[^;]*;\s*(?<remaining_cookies>.*)$" $remaining_cookies;
        "~^(?<leading_cookies>.*);\s*__Host-aisecedu-session=[^;]*;\s*(?<trailing_cookies>.*)$" "$leading_cookies; $trailing_cookies";
        "~^(?<leading_cookies>.*);\s*__Host-aisecedu-session=[^;]*$" $leading_cookies;
        "~^__Host-aisecedu-session=[^;]*$" "";
    }

    # The renderer receives only a short-lived, scope-bound capability. The
    # platform session must never cross the isolated runtime boundary.
    map $http_cookie $agent_runtime_cookie {
        default "";
        "~*(?:^|;\s*)(?<agent_runtime_cookie_pair>aisecedu_agent_runtime=[^;]+)" $agent_runtime_cookie_pair;
    }

    upstream ctfd_upstream {
        zone ctfd_upstream 64k;
        server ctfd:8000 resolve;
    }

    upstream agent_runtime_upstream {
        zone agent_runtime_upstream 64k;
        server agent-runtime:3000 resolve;
    }

    include /etc/nginx/conf.d/server-http.conf;
    include /etc/nginx/conf.d/server-https.conf;

    include /etc/nginx/conf.d/server-http-future.conf;
    include /etc/nginx/conf.d/server-https-future.conf;

    include /etc/nginx/conf.d/workspace-http.conf;
    include /etc/nginx/conf.d/workspace-https.conf;
}
