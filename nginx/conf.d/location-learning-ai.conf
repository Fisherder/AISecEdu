location ^~ /pwncollege_api/v1/learning/ {
    proxy_pass http://ctfd_upstream;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Course materials are validated and capped at 50 MiB by the teaching API.
# Allow a small multipart envelope above that limit so valid 50 MiB files can
# reach the application and oversized files receive a structured response.
location = /pwncollege_api/v1/teaching/materials {
    client_max_body_size 52m;
    client_body_timeout 120s;
    error_page 413 = @teaching_material_too_large;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://ctfd_upstream;
}

location @teaching_material_too_large {
    default_type application/json;
    return 413 '{"success":false,"error":"文件超过 50 MB，请压缩或拆分后再上传。","errorCode":"PAYLOAD_TOO_LARGE"}';
}
