# Support websockets
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $proxy_connection;

# Pass the original host and client info
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Original-URI $uri;

# Internal services use this credential only over the Compose network. Never
# allow a browser-supplied value to cross the public reverse-proxy boundary.
proxy_set_header X-AISecEdu-Service-Token "";

# Trace ID for debugging across services
proxy_set_header PWN-Trace-ID $request_id;

# Mitigate httpoxy attack
proxy_set_header Proxy "";
