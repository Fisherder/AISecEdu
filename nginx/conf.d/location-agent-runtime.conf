location = /openmaic {
    return 308 /teacher;
}

location ^~ /openmaic/ {
    return 308 /teacher;
}

location = /agent-runtime {
    return 308 /teacher;
}

# A launch ticket is a one-time credential in the query string, so the
# exchange is never logged and receives no ambient browser cookies.
location = /agent-runtime/api/integration/exchange {
    access_log off;
    include /etc/nginx/conf.d/proxy-headers.conf;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Prefix /agent-runtime;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://agent_runtime_upstream;
}

location = /agent-runtime/api/integration/metrics {
    return 404;
}

# Older personal-workspace sessions point learning-path artifacts at the
# interactive classroom route. Those artifacts have a document-shaped payload,
# while the runtime is embedded in a sandboxed iframe. First load a tiny
# same-origin bridge which asks the already-validated parent page to navigate
# to the first-party artifact reader.
location = /agent-runtime/compat/personal-artifact {
    if ($arg_artifact !~ ^artifact_[A-Za-z0-9_-]+$) {
        return 404;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'self'" always;
    return 200 '<!doctype html><meta charset="utf-8"><title>正在打开学习成果</title><script>window.parent.postMessage({type:"aisecedu:open-personal-artifact",artifactId:"$arg_artifact"},window.location.origin);</script><p>正在打开学习成果…</p>';
}

location ^~ /agent-runtime/classroom/study_ {
    rewrite ^/agent-runtime/classroom/study_(artifact_[A-Za-z0-9_-]+)$ /agent-runtime/compat/personal-artifact?artifact=$1 last;
    return 404;
}

location ^~ /agent-runtime/ {
    client_max_body_size 50m;
    include /etc/nginx/conf.d/proxy-headers.conf;
    proxy_set_header Cookie $agent_runtime_cookie;
    proxy_set_header X-Forwarded-Prefix /agent-runtime;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://agent_runtime_upstream;
}
