# Starting hundreds of isolated Kata workspaces is intentionally synchronous:
# the response means the learner can proceed to the service picker.  The
# generic nginx default of 60 seconds can expire while Docker is still
# completing a successful classroom-wide burst, so give this one lifecycle
# endpoint the same bounded window used by the client and load verifier.
location = /pwncollege_api/v1/docker {
    proxy_pass http://ctfd_upstream;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Expensive on-demand services use a bounded admission queue during a full
# classroom cold start. Keep the browser connection alive while the learner's
# slot advances instead of turning responsible backpressure into a 504.
location = /pwncollege_api/v1/workspace {
    proxy_pass http://ctfd_upstream;
    proxy_connect_timeout 30s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
