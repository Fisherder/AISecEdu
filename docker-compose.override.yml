services:
  workspace-builder:
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        profile=/nix/var/nix/profiles/dojo-workspace
        expected=/nix/store/0hs7db796vbhdnjfzpyq7h7aq3wr6wm6-dojo-workspace-full
        actual=$$(readlink -f "$$profile")
        test "$$actual" = "$$expected"
        closure_count=$$(nix-store --store local -qR "$$actual" | wc -l)
        test "$$closure_count" -eq 2366
        suid_file="$$actual/suid"
        test -f "$$suid_file"
        while IFS= read -r path; do
          test -e "$$path"
          chmod u+s "$$path"
        done < "$$suid_file"
        echo "Reused verified migrated workspace profile: $$actual ($$closure_count paths)"
